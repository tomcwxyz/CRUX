name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Dogfood runtime instrumentation
        run: node packages/instrumentation/examples/pipeline-dogfood.mjs
      - name: Validate external-provider smoke harness
        run: node packages/instrumentation/examples/live-gateway-smoke.mjs
      - name: Dogfood standalone CLI
        run: |
          node packages/cli/dist/index.js validate examples/funding-review/crux.json
          node packages/cli/dist/index.js validate examples/writing-assistant/crux.json
          node packages/cli/dist/index.js validate examples/observed-divergence/crux.json
          node packages/cli/dist/index.js validate examples/bounded-action/crux.json
          node packages/cli/dist/index.js inspect examples/funding-review/crux.json --as-of 2026-09-15T12:00:00+00:00
          node packages/cli/dist/index.js inspect examples/bounded-action/crux.json --as-of 2026-09-17T07:00:00+00:00
          node packages/cli/dist/index.js redact examples/funding-review/crux.json --level public -o /tmp/crux-public.json
          node packages/cli/dist/index.js redact examples/funding-review/crux.json --level affected_party -o /tmp/crux-affected.json
          node packages/cli/dist/index.js redact examples/bounded-action/crux.json --level affected_party -o /tmp/crux-bounded-affected.json
          node packages/cli/dist/index.js validate /tmp/crux-bounded-affected.json
          node packages/cli/dist/index.js ingest-evidence examples/funding-review/crux.json examples/evidence/ci-eval-envelope.json -o /tmp/crux-with-ci-evidence.json
          node packages/cli/dist/index.js validate /tmp/crux-with-ci-evidence.json
          node packages/cli/dist/index.js ingest-evidence /tmp/crux-with-ci-evidence.json examples/evidence/ci-eval-envelope.json -o /tmp/crux-with-ci-evidence-replayed.json
          node packages/cli/dist/index.js validate /tmp/crux-with-ci-evidence-replayed.json
          node packages/cli/dist/index.js schema -o /tmp/crux-bundle.schema.json
